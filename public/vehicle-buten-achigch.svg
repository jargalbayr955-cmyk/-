<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Бүтэн ачигч дээр хар дөрвөлжин SUV бүтнээр ачсан хажуугийн тод зураг">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#78c9ff"/><stop offset="1" stop-color="#dff5ff"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#67727a"/><stop offset="1" stop-color="#333a40"/></linearGradient>
  <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#dde6eb"/></linearGradient>
  <linearGradient id="suv" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26333e"/><stop offset="1" stop-color="#070a0d"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".25"/></filter>
</defs>
<rect width="900" height="520" rx="32" fill="url(#sky)"/>
<g opacity=".38" fill="#6d9bc0"><rect x="35" y="120" width="70" height="190"/><rect x="120" y="155" width="55" height="155"/><rect x="195" y="95" width="82" height="215"/><rect x="670" y="135" width="72" height="175"/><rect x="758" y="100" width="95" height="210"/></g>
<g fill="#62aa57"><circle cx="44" cy="305" r="45"/><circle cx="91" cy="308" r="38"/><circle cx="808" cy="300" r="46"/><circle cx="858" cy="310" r="36"/></g>
<rect y="356" width="900" height="164" fill="url(#road)"/>
<path d="M25 466H205M690 466H875" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".86"/>
<g filter="url(#shadow)">
  <!-- long yellow flatbed: makes full loading immediately obvious -->
  <rect x="215" y="329" width="625" height="48" rx="9" fill="#f5ad16"/>
  <rect x="230" y="340" width="593" height="13" rx="6" fill="#24282c"/>
  <g fill="#111"><rect x="255" y="343" width="40" height="7"/><rect x="322" y="343" width="40" height="7"/><rect x="389" y="343" width="40" height="7"/><rect x="456" y="343" width="40" height="7"/><rect x="523" y="343" width="40" height="7"/><rect x="590" y="343" width="40" height="7"/><rect x="657" y="343" width="40" height="7"/><rect x="724" y="343" width="40" height="7"/></g>
  <!-- white carrier cab -->
  <path d="M54 207h137c47 0 82 36 82 82v88H34V269c0-36 8-62 20-62Z" fill="url(#cab)" stroke="#9ba8b1" stroke-width="5"/>
  <path d="M83 223h83c34 0 60 27 60 60v18H72v-52c0-16 4-26 11-26Z" fill="#72bbe6"/>
  <path d="M37 310h205v58H40Z" fill="#f2f6f8"/>
  <rect x="41" y="359" width="250" height="27" rx="8" fill="#282e33"/>
  <rect x="141" y="185" width="62" height="14" rx="7" fill="#ff9b16"/><rect x="154" y="178" width="37" height="8" rx="4" fill="#ff6d00"/>
  <path d="M216 320h55v-67h18l27 76H216Z" fill="#f2a914"/>
  <!-- carrier's own two visible wheels; rear wheel stays under the truck deck -->
  <g fill="#15191c" stroke="#edf1f3" stroke-width="8"><circle cx="105" cy="407" r="44"/><circle cx="305" cy="407" r="44"/></g>
  <g fill="#747f88"><circle cx="105" cy="407" r="18"/><circle cx="305" cy="407" r="18"/></g>
  <!-- black boxy SUV clearly sitting ON TOP of the yellow deck -->
  <g transform="translate(350 137)">
    <path d="M35 127 76 47c9-18 25-28 47-28h232c22 0 39 9 49 28l42 79 23 14v178H0V169c0-23 12-36 35-42Z" fill="url(#suv)" stroke="#394550" stroke-width="6"/>
    <path d="M112 48 82 105h108V48h-78Zm102 0v57h166l-30-52c-7-11-19-17-37-17Z" fill="#769db3" opacity=".9"/>
    <rect x="29" y="132" width="411" height="47" rx="15" fill="#11171c"/>
    <rect x="204" y="45" width="8" height="103" rx="4" fill="#303b43"/>
    <rect x="16" y="178" width="438" height="35" rx="14" fill="#151a1e"/>
    <!-- SUV's two visible wheels ABOVE the deck -->
    <g fill="#101315" stroke="#e8ecef" stroke-width="8"><circle cx="101" cy="207" r="42"/><circle cx="365" cy="207" r="42"/></g>
    <g fill="#717d86"><circle cx="101" cy="207" r="16"/><circle cx="365" cy="207" r="16"/></g>
  </g>
</g>
</svg>