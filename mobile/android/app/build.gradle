plugins { id 'com.android.application' }

android {
    namespace 'mn.achilt.driver'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'mn.achilt.driver'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '5.5.2-preview'
        // HTTPS only. This is an app origin, never an API key or a secret.
        buildConfigField 'String', 'SITE_ORIGIN', '"https://lovat-three-54.vercel.app"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-debug' }
        release { minifyEnabled false }
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
