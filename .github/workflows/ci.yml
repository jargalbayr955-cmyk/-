name: CI

on:
  push:
    branches:
      - main
      - v5.6-google-maps-current
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef
      PAYMENT_WEBHOOK_SECRET: ci-only-payment-secret-0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Test and compile Android driver
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
