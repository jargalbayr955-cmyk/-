name: CI

on:
  push:
    branches:
      - main
      - v5.6-google-maps-current
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef
      PAYMENT_WEBHOOK_SECRET: ci-only-payment-secret-0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Test and compile Android driver
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AchiltDriver-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish preview APK on the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        run: |
          if [ "$(git log -1 --pretty=%s)" = "Update compiled driver APK" ]; then
            echo "Compiled APK is already the branch head; skip republishing."
            exit 0
          fi
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk public/downloads/AchiltDriver-5.5.5-preview.apk
          sha256sum public/downloads/AchiltDriver-5.5.5-preview.apk > public/downloads/AchiltDriver-5.5.5-preview.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/AchiltDriver-5.5.5-preview.apk public/downloads/AchiltDriver-5.5.5-preview.apk.sha256
          if git diff --cached --quiet; then
            echo "APK is unchanged."
            exit 0
          fi
          git commit -m "Update compiled driver APK"
          git push origin HEAD:${{ github.head_ref }}
